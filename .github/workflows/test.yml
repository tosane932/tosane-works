name: Bakery Hub Tests

on:
  push:
    branches: [ main, feature/v3-unified-product-management ]
    paths:
      - "store/bakery-hub/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "store/bakery-hub/**"
      - ".github/workflows/test.yml"

defaults:
  run:
    working-directory: store/bakery-hub

jobs:
  register-browser-e2e:
    if: github.event_name != 'pull_request' || (github.head_ref != 'ops/v3-production-db-backup-readiness' && github.head_ref != 'ops/v3-g580-encrypted-db-backup' && github.head_ref != 'ops/v3-phase3c-restore-verification')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated E2E dependencies
        working-directory: store/bakery-hub
        run: |
          pip install -r requirements.txt
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run Chromium offline register E2E
        working-directory: store/bakery-hub
        run: npx playwright test --config=tests_e2e/playwright.config.cjs
      - name: Upload synthetic home weather screenshots
        uses: actions/upload-artifact@v4
        with:
          name: home-weather-screenshots
          path: store/bakery-hub/test-results/home_weather-*/*.png
          retention-days: 7
      - name: Upload E2E trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: register-browser-traces
          path: store/bakery-hub/test-results/
          retention-days: 3

  test:
    if: github.event_name != 'pull_request' || (github.head_ref != 'ops/v3-production-db-backup-readiness' && github.head_ref != 'ops/v3-g580-encrypted-db-backup' && github.head_ref != 'ops/v3-phase3c-restore-verification')
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt

      - name: JavaScriptテストを実行
        run: |
          node --test tests_js/home_weather.test.cjs tests_js/register_core.test.cjs tests_js/register_ui.test.cjs tests_js/register_demo.test.cjs tests_js/register_offline.test.cjs tests_js/register_pager.test.cjs tests_js/register_cash_pad.test.cjs

      - name: pytestを実行
        run: |
          pytest -v

  postgres-integration:
    if: github.event_name != 'pull_request' || (github.head_ref != 'ops/v3-production-db-backup-readiness' && github.head_ref != 'ops/v3-g580-encrypted-db-backup' && github.head_ref != 'ops/v3-phase3c-restore-verification')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: sales_data_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d sales_data_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRESQL_DATABASE_URL: >-
        postgresql+psycopg2://ci_test_user:ci_test_password@127.0.0.1:5432/sales_data_app_test
      ALLOW_POSTGRESQL_TEST_DATABASE_RESET: "1"

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt

      - name: PostgreSQL migrationを検証
        run: |
          pytest tests/test_migrations_postgresql.py tests/test_register_postgresql.py tests/test_register_products_postgresql.py tests/test_register_service_postgresql.py tests/test_register_sales_aggregation_postgresql.py tests/test_register_cutover_postgresql.py tests/test_unified_products_postgresql.py -v

      - name: 商品設定CSVを別の空PostgreSQLへ復元して照合
        run: pytest tests/test_data_vault_postgresql.py -v

      - name: PostgreSQL実並行処理を検証
        run: |
          pytest \
            tests/test_admin_login_rate_limit_postgresql.py \
            tests/test_guest_active_dataset_limit_postgresql.py \
            tests/test_guest_product_lifetime_limit_postgresql.py \
            tests/test_guest_cleanup_postgresql.py \
            tests/test_material_orders_postgresql.py \
            tests/test_sales_postgresql.py \
            tests/test_forecast_postgresql.py \
            tests/test_shop_memos_postgresql.py \
            tests/test_shop_staff_shifts_postgresql.py \
            tests/test_prep_postgresql.py \
            -v

      - name: 隔離DBの全量バックアップと別DBへの復元を検証
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pytest tests/test_register_backup_restore_postgresql.py -v

  backup-readiness:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/v3-production-db-backup-readiness'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: sales_data_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d sales_data_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRESQL_DATABASE_URL: >-
        postgresql+psycopg2://ci_test_user:ci_test_password@127.0.0.1:5432/sales_data_app_test
      ALLOW_POSTGRESQL_TEST_DATABASE_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and test-only PostgreSQL client
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Synthetic backup and local safety checks only
        run: pytest tests/test_production_backup_guard.py tests/test_register_backup_restore_postgresql.py -v

  startup-safety-pg18:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/v3.1-phase3f-startup-safety'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: sales_data_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d sales_data_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRESQL_DATABASE_URL: >-
        postgresql+psycopg2://ci_test_user:ci_test_password@127.0.0.1:5432/sales_data_app_test
      ALLOW_POSTGRESQL_TEST_DATABASE_RESET: "1"
      STARTUP_GUARD_PG18_SYNTHETIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest tests/test_startup_guard.py tests/test_seed_demo.py tests/test_startup_guard_postgresql.py -v
      - name: Start actual web container twice without migration or seed
        run: |
          docker build -t bakeryhub-startup-synthetic .
          for round in 1 2; do
            container=$(docker run -d --network host \
              -e DATABASE_URL="$TEST_POSTGRESQL_DATABASE_URL" \
              -e SECRET_KEY=synthetic-only \
              bakeryhub-startup-synthetic)
            trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
            ready=0
            for attempt in $(seq 1 30); do
              if curl --silent --fail http://127.0.0.1:5000/login >/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1
            docker stop "$container" >/dev/null
            python -c 'import os; from sqlalchemy import create_engine,text; e=create_engine(os.environ["TEST_POSTGRESQL_DATABASE_URL"]); c=e.connect(); assert tuple(c.execute(text("SELECT count(*) FROM " + t)).scalar_one() for t in ("products","daily_sales","register_products","prep_recipes","prep_ingredients")) == (0,0,1,1,1); c.close(); e.dispose()'
            trap - EXIT
          done

  encrypted-backup:
    if: github.event_name == 'pull_request' && (github.head_ref == 'ops/v3-g580-encrypted-db-backup' || github.head_ref == 'ops/v3-phase3c-restore-verification' || github.head_ref == 'ops/v3.1-phase3f-offline-restore-guard')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      source:
        image: postgres:18
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: sales_data_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d sales_data_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      target:
        image: postgres:18
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: restore_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENCRYPTED_BACKUP_SYNTHETIC_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic test dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y age curl ca-certificates
          sudo install -d -m 755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: noble-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          pg_dump --version
          pg_restore --version
          age --version
      - name: Targeted age streaming and safety tests only
        run: pytest tests/test_production_backup_guard.py tests/test_production_backup_offline.py tests/test_production_backup_encrypted_postgresql.py -v
      - name: Phase 3C isolated schema and read-only SQL only
        if: github.head_ref == 'ops/v3-phase3c-restore-verification'
        run: pytest tests/test_g580_restore_verification_postgresql.py -v
      - name: Phase 3C internal bridge and tmpfs smoke test only
        if: github.head_ref == 'ops/v3-phase3c-restore-verification'
        run: bash tests/sh/test_g580_restore_container.sh
