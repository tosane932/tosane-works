name: Puoppo Smoke Check

on:
  push:
    branches: [ main ]
    paths:
      - "information/puoppo/**"
      - ".github/workflows/puoppo.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "information/puoppo/**"
      - ".github/workflows/puoppo.yml"

defaults:
  run:
    working-directory: information/puoppo

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ci-dummy-api-key

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: Python構文を確認
        run: python -m compileall -q app.py

      - name: Flaskと画面のsmoke check
        run: |
          python - <<'PY'
          import app as puoppo

          flask_app = puoppo.app
          flask_app.config.update(TESTING=True)

          assert puoppo.DEBUG is False
          assert flask_app.debug is False
          assert flask_app.config["GOOGLE_LOGIN_ENABLED"] is False
          assert flask_app.config["GOOGLE_LOGIN_AVAILABLE"] is False

          expected_routes = {
              "/",
              "/delete",
              "/login",
              "/login/google/callback",
              "/logout",
              "/search",
              "/static/<path:filename>",
          }
          actual_routes = {rule.rule for rule in flask_app.url_map.iter_rules()}
          assert expected_routes <= actual_routes

          flask_app.jinja_env.get_template("index.html")
          flask_app.jinja_env.get_template("result.html")

          with flask_app.test_client() as client:
              index_response = client.get("/")
              assert index_response.status_code == 200
              assert "Googleでログイン" not in index_response.get_data(as_text=True)
              assert client.get("/static/style.css").status_code == 200
              assert client.get("/login").status_code == 404
              assert client.get("/login/google/callback").status_code == 404
              assert client.get("/logout").status_code == 405
          PY

      - name: 認証・履歴・API回数制限を検証
        run: python -m unittest discover -s tests -v
